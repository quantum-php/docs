# Wording checks for the docs (https://vale.sh).
# Run from the repository root: vale README.md SUMMARY.md v3.0

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Quantum

[*.md]
BasedOnStyles = Vale, Quantum
# The vocabulary lists both spellings of some names (JWT and the package Jwt), so it only feeds
# the spell check; Quantum.Names enforces the spelling of names.
Vale.Terms = NO

# The upgrade guide describes what changed, so it may say "previously" and "no longer".
[v3.0/upgrade-guide.md]
Quantum.History = NO
