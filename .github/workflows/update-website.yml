name: Update website

# When the released documentation changes on master, ask quantum-php/website to rebuild
# and deploy quantumphp.io. The token (secret WEBSITE_DISPATCH_TOKEN) only needs
# "Contents: read and write" on quantum-php/website.

on:
  push:
    branches: [master]
    paths:
      - 'v3.0/**'
      - 'SUMMARY.md'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the website repository to rebuild
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The WEBSITE_DISPATCH_TOKEN secret is not set"
            exit 1
          fi
          gh api repos/quantum-php/website/dispatches \
            -f event_type=docs-updated \
            -f "client_payload[commit]=$COMMIT"
          echo "Asked quantum-php/website to rebuild for $COMMIT"
